[project]
name = "possession"
version = "0.1.0"
description = "Football possession labelling for More Than A Hack 2027"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.4.4",
    "pandas==3.0.2",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "threadpoolctl==3.7.0",
]

[dependency-groups]
dev = ["pytest==9.0.3"]
external = ["kloppy==3.19.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/possession"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
